name: Brain Integrity and Explorer
on:
  push:
    paths:
      - "backend/src/brain*.ts"
      - "backend/src/brain-runtime-manifest.json"
      - "README.md"
      - "scripts/check-brain-docs.cjs"
      - "frontend/src/generated/brainCommandSuggestions.json"
      - "frontend/src/components/SuperAgentCommands.ts"
      - "frontend/src/components/SuperAgentConsole.tsx"
      - "backend/tests/brain*.test.ts"
      - "frontend/src/components/SuperAgentBrainExplorer.tsx"
      - "frontend/src/components/SuperAgentBrainTaskPanel.tsx"
      - "frontend/src/components/__tests__/SuperAgentBrainTaskPanel.test.tsx"
      - "frontend/src/components/__tests__/SuperAgentBrainExplorer.test.tsx"
      - "scripts/check-brain-runtime.cjs"
      - ".github/workflows/brain-integrity.yml"
  pull_request:
    paths:
      - "README.md"
      - "scripts/check-brain-docs.cjs"
      - "frontend/src/generated/brainCommandSuggestions.json"
      - "frontend/src/components/SuperAgentCommands.ts"
      - "frontend/src/components/SuperAgentConsole.tsx"
      - "frontend/src/components/__tests__/SuperAgentCliParity.test.ts"
      - "backend/src/brain*.ts"
      - "backend/src/brain-runtime-manifest.json"
      - "backend/tests/brain*.test.ts"
      - "frontend/src/components/SuperAgentBrainExplorer.tsx"
      - "frontend/src/components/__tests__/SuperAgentBrainExplorer.test.tsx"
      - "scripts/check-brain-runtime.cjs"
      - ".github/workflows/brain-integrity.yml"
  workflow_dispatch:

jobs:
  brain:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify README setup and Brain docs
        run: bun scripts/check-brain-docs.cjs
      - name: Verify generated Brain Core integrity
        run: bun scripts/check-brain-runtime.cjs
      - name: Build backend
        run: bun run build:backend
      - name: Build frontend
        run: bun run build:frontend
      - name: Brain backend tests
        run: bun --bun x vitest run backend/tests/brainExplorerRoutes.test.ts
      - name: Brain UI tests
        run: bun --bun x vitest run --config vite.config.ts src/components/__tests__/SuperAgentBrainExplorer.test.tsx src/components/__tests__/SuperAgentBrainTaskPanel.test.tsx src/components/__tests__/SuperAgentCliParity.test.ts
        working-directory: frontend
