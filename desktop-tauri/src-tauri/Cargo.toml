[package]
name = "app"
version = "1.3.696"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-log = "2"
sysinfo = "0.30"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Use ureq (sync) instead of reqwest (which pulls in tokio via "blocking" feature).
# ureq is a small, dependency-light synchronous HTTP client — no async runtime overhead,
# no conflict with Tauri's own runtime. RAM savings: ~5-15 MB.
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[features]
# Default features are empty so production builds (`cargo tauri build`)
# do NOT pull in the Chrome DevTools CDP server, which would add
# 20-50 MB per WebView at runtime. Enable explicitly for dev work:
#   cargo tauri dev --features devtools
default = []
devtools = ["tauri/devtools"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
